# Drivers build to WebAssembly components, apart from the host workspace.
# `cargo build --release` here produces one `.wasm` per driver (see .cargo/config.toml).
[workspace]
resolver = "3"
members = ["sdk", "hollow-knight", "silksong", "schedule-one", "hades"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
hundo-sdk = { path = "sdk" }
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
